version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: kannur_mysql
    restart: unless-stopped
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-time-zone=+00:00
      --sql-mode=STRICT_ALL_TABLES,NO_ENGINE_SUBSTITUTION,ONLY_FULL_GROUP_BY,ERROR_FOR_DIVISION_BY_ZERO
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${DB_NAME:-kannur_rd_db}
      MYSQL_USER: ${DB_USER:-kannur_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-kannur_pass}
    ports:
      - "${DB_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-rootpassword}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: kannur_mailhog
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP server
      - "8025:8025" # Web UI
    logging:
      driver: 'none'

  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: kannur_api
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 5000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-kannur_rd_db}
      DB_USER: ${DB_USER:-kannur_user}
      DB_PASSWORD: ${DB_PASSWORD:-kannur_pass}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-kannur_university_rd_cell_access_secret_2026}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-kannur_university_rd_cell_refresh_secret_2026}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
    ports:
      - "5000:5000"
    volumes:
      - ./server:/app
      - /app/node_modules
      - upload_data:/app/data/uploads

  web:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: kannur_web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "3000:80"

volumes:
  mysql_data:
  upload_data:
